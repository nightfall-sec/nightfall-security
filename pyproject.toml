[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "nightfall-security"
version = "0.1.0"
description = "NIGHTFALL Defensive Security Toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "NIGHTFALL" }
]

dependencies = []


[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]


[project.scripts]
nightfall = "nightfall.cli:main"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
